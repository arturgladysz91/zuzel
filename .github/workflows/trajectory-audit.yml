name: Diagnostic trajectory platform audit
on:
  pull_request:
    paths:
      - 'tools/trajectory-audit/**'
      - '.github/workflows/trajectory-audit.yml'
permissions:
  contents: read
jobs:
  capture:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        source: [audited, current]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare isolated diagnostic checkout
        shell: bash
        run: |
          cp src/CoreSim/Analysis/TrajectoryBehaviorFingerprint.cs "$RUNNER_TEMP/fingerprint.cs"
          if [ '${{ matrix.source }}' = audited ]; then
            git worktree add --detach "$RUNNER_TEMP/audited" 9ff730c5b1b2cfca739c3ead2ccc2760be1b7c71
            mkdir -p "$RUNNER_TEMP/audited/tools"
            cp -r tools/trajectory-audit "$RUNNER_TEMP/audited/tools/"
            echo "CAPTURE_ROOT=$RUNNER_TEMP/audited" >> "$GITHUB_ENV"
          else
            echo "CAPTURE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Capture exact workload
        shell: bash
        run: |
          python tools/trajectory-audit/prepare.py "$CAPTURE_ROOT" "$RUNNER_TEMP/fingerprint.cs"
          git -C "$CAPTURE_ROOT" rev-parse HEAD
          dotnet --list-runtimes
          dotnet run --project "$CAPTURE_ROOT/tools/trajectory-audit" -c Release -- "$RUNNER_TEMP/capture"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.source }}
          path: ${{ runner.temp }}/capture
  compare:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: captures
      - run: python tools/trajectory-audit/compare.py captures
      - uses: actions/upload-artifact@v4
        with:
          name: platform-comparison
          path: captures/comparison.json
