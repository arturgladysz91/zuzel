name: Study 176 isolated axle-load audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-176-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Study 176 build and native archive invariants
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: study176-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-net8-
      - run: dotnet restore tools/dynamic-axle-load/dynamic-axle-load.csproj --locked-mode
      - run: dotnet build tools/dynamic-axle-load/dynamic-axle-load.csproj -c Release --no-restore --warnaserror
      - name: Verify OFF and audited archives without creating worlds
        run: |
          git rev-parse HEAD
          dotnet tools/dynamic-axle-load/bin/Release/net8.0/dynamic-axle-load.dll
          if ($LASTEXITCODE -ne 2) { throw 'Study 176 must be OFF without explicit arguments' }
          $global:LASTEXITCODE = 0
          python tools/dynamic-axle-load/verify176.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
