name: Study 173 isolated audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-173-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-map:
    name: Study 173 build and zero-world audit
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: study173-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-net8-
      - run: dotnet restore tools/throttle-decision-audit/throttle-decision-audit.csproj --locked-mode
      - run: dotnet build tools/throttle-decision-audit/throttle-decision-audit.csproj -c Release --no-restore --warnaserror
      - name: Require OFF and original cyclic geometry; no native rollout
        run: |
          git rev-parse HEAD
          $dll = 'tools/throttle-decision-audit/bin/Release/net8.0/throttle-decision-audit.dll'
          dotnet $dll
          if ($LASTEXITCODE -ne 2) { throw 'Study 173 must be OFF without explicit arguments' }
          $global:LASTEXITCODE = 0
          dotnet $dll geometry ci173 results/map173
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/throttle-decision-audit/verify173.py --geometry results/map173/ci173-geometry.json
