name: Core simulation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SpeedwayManager.sln
      - name: Build
        run: dotnet build SpeedwayManager.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test SpeedwayManager.sln --configuration Release --no-build --verbosity normal
