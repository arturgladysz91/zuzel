name: Core simulation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Includes the analysis-only combined-grip sweep and independent zero-path optimizer replay.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact tested commit
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git log -1 --format=%P
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SpeedwayManager.sln
      - name: Build
        run: dotnet build SpeedwayManager.sln --configuration Release --no-restore
      - name: Test deterministic dataset preparation rules
        run: python -m unittest discover -s tests/calibration -p 'test_*.py'
      - name: Test
        run: dotnet test SpeedwayManager.sln --configuration Release --no-build --verbosity normal
