name: Core simulation CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      historical_audits:
        description: Also run historical Windows captures and pinned-commit comparisons
        type: boolean
        default: true
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A description/title edit must not cancel validation of the same source.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base) && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

defaults:
  run:
    shell: pwsh

jobs:
  coverage:
    # One Windows compilation and complete discovery for every run, including Drafts.
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.policy.outputs.full }}
      historical: ${{ steps.policy.outputs.historical }}
      shards: ${{ steps.policy.outputs.shards }}
    steps:
      - name: Keep frozen Git blob bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact tested commit
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git log -1 --format=%P
      - name: Select Draft, full and historical responsibilities
        id: policy
        run: python tools/ci/policy.py
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-net8-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '**/NuGet.Config', '**/nuget.config', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-net8-
      - run: dotnet restore SpeedwayManager.sln
      - run: dotnet build SpeedwayManager.sln -c Release --no-restore --warnaserror
      - name: Require unchanged legacy production skill and style consumers
        run: python tools/rider-compatibility-audit/check-consumers.py
      - name: Prove exactly one responsibility for every discovered test case
        run: python tools/ci/check-shards.py results/discovery
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            tests/CoreSim.Tests/bin/Release
            src/Sandbox/bin/Release
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-discovery
          path: results/discovery
          if-no-files-found: error

  dotnet:
    # Draft: all core + trajectory cases. Full: all four original shards, once.
    needs: coverage
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.coverage.outputs.shards || '["core", "trajectory", "historical-analysis", "four-rider"]') }}
    steps:
      - name: Keep frozen Git blob bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
      - uses: actions/download-artifact@v4
        with:
          name: dotnet-discovery
          path: results/discovery
      - name: Execute complete shard from the shared Windows build
        run: dotnet vstest tests/CoreSim.Tests/bin/Release/net8.0/CoreSim.Tests.dll --TestCaseFilter:"Shard=${{ matrix.shard }}" --Logger:"trx;LogFileName=shard.trx" --ResultsDirectory:results
      - name: Check executed cases and publish top 20 duration profile
        if: always()
        run: python tools/ci/profile-results.py results ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-${{ matrix.shard }}
          path: results
          if-no-files-found: error

  historical-audits:
    # Explicit/weekly mode, also compulsory for ready PRs changing the engine or its evidence.
    needs: coverage
    if: needs.coverage.outputs.historical == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Keep frozen Git blob bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-net8-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '**/NuGet.Config', '**/nuget.config', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-net8-
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
      - name: Capture physical contact arithmetic regression
        run: |
          dotnet run --project tools/physical-contact-consequence-audit -c Release -- results/physical-contact-consequences --trace
          dotnet run --project tools/physical-contact-consequence-audit -c Release -- results/physical-contact-consequences --yield-probe
      - name: Capture typed IEEE values and final rider/raw surface states
        shell: bash
        run: |
          python tools/trajectory-audit/prepare.py . src/CoreSim/Analysis/TrajectoryBehaviorFingerprint.cs
          dotnet run --project tools/trajectory-audit -c Release -- results/capture
          dotnet src/Sandbox/bin/Release/net8.0/Sandbox.dll physical-occupancy-report results/physical-space
          dotnet run --project tools/rider-compatibility-audit -c Release -- results/rider-compatibility
          dotnet run --project tools/contested-space-audit -c Release -- results/contested-space
          dotnet run --project tools/physical-contact-audit -c Release -- results/physical-contact --minimal-yield
          dotnet run --project tools/physical-contact-consequence-audit -c Release -- results/physical-contact-consequences --minimal-yield
      - name: Compare intended #67 behavior with main and prove exact certificate reuse
        shell: bash
        run: |
          git fetch origin f40b2fd129124d969fd22cfe7767e2fb00bd651f
          git worktree add --detach ../contested-baseline f40b2fd129124d969fd22cfe7767e2fb00bd651f
          baseline="$(cd ../contested-baseline && pwd)"
          dotnet build tools/contested-performance -c Release --warnaserror -p:CoreSimRoot="$baseline" -o ../contested-before-bin
          dotnet build tools/contested-performance -c Release --warnaserror -o ../contested-after-bin
          dotnet ../contested-before-bin/CoreSim.Tests.dll capture results/contested-performance/before.json --raw
          dotnet ../contested-after-bin/CoreSim.Tests.dll capture results/contested-performance/after.json --raw
          python tools/minimal-yield-audit/compatibility.py contested results/contested-performance
          dotnet ../contested-after-bin/CoreSim.Tests.dll type-probe results/contested-performance/types.json
          python tools/contested-performance/verify-types.py results/contested-performance/types.json
          dotnet build tools/contested-space-audit -c Release --warnaserror -p:CoreSimRoot="$baseline" -o ../contested-presentation-before-bin
          dotnet ../contested-presentation-before-bin/contested-space-audit.dll results/contested-space-before
          dotnet build tools/minimal-yield-audit -c Release --warnaserror -p:CoreSimRoot="$baseline" -o ../yield-before-bin
          dotnet build tools/minimal-yield-audit -c Release --warnaserror -o ../yield-after-bin
          dotnet ../yield-before-bin/CoreSim.Tests.dll results/yield-before.json
          dotnet ../yield-after-bin/CoreSim.Tests.dll results/yield-after.json
          python tools/minimal-yield-audit/measure.py results/yield-before.json results/yield-after.json results/yield-measurements.json
          git fetch origin 5373d594172985f4d5cfb692374e1f05cc7f18f2
          git worktree add --detach ../contested-optimization-baseline 5373d594172985f4d5cfb692374e1f05cc7f18f2
          baseline="$(cd ../contested-optimization-baseline && pwd)"
          dotnet build tools/contested-performance -c Release --warnaserror -p:CoreSimRoot="$baseline" -o ../contested-optimization-before-bin
          dotnet ../contested-optimization-before-bin/CoreSim.Tests.dll capture results/contested-performance/optimization-before.json --raw --with-contact
          dotnet ../contested-after-bin/CoreSim.Tests.dll capture results/contested-performance/optimization-after.json --raw --with-contact
          python tools/contested-performance/compare.py results/contested-performance --optimization
      - name: Capture complete enabled contact decisions before and after sequential recovery correction
        shell: bash
        run: |
          git fetch origin a420fac248019e4ec7b852689c6d6a818adfa49e
          git worktree add --detach ../contact-decision-baseline a420fac248019e4ec7b852689c6d6a818adfa49e
          baseline="$(cd ../contact-decision-baseline && pwd)"
          dotnet build tools/contact-decision-audit -c Release --warnaserror -p:CoreSimRoot="$baseline" -o ../contact-decision-before-bin
          dotnet build tools/contact-decision-audit -c Release --warnaserror -o ../contact-decision-after-bin
          dotnet ../contact-decision-before-bin/CoreSim.Tests.dll capture results/contact-decision/before.json
          dotnet ../contact-decision-after-bin/CoreSim.Tests.dll capture results/contact-decision/after.json
      - name: Bounded readiness smoke and exact original-main observation parity
        shell: bash
        run: |
          git fetch origin c13af7b8a16fe4e58e9d404c849cdf323649b0ed
          git fetch origin 350f59cc53184399066bdf93b18341e4628ec8ef
          # REA-001 authorizes a production correction. Frozen audit evidence and data stay unchanged.
          git diff --exit-code 350f59cc53184399066bdf93b18341e4628ec8ef HEAD -- data docs/calibration/race-engine-readiness
          git worktree add --detach ../readiness-baseline c13af7b8a16fe4e58e9d404c849cdf323649b0ed
          baseline="$(cd ../readiness-baseline && pwd)"
          dotnet build tools/race-engine-readiness -c Release --warnaserror -p:CoreSimRoot="$baseline" -o ../readiness-before-bin
          dotnet build tools/race-engine-readiness -c Release --warnaserror -o ../readiness-after-bin
          dotnet ../readiness-before-bin/CoreSim.Tests.dll smoke results/readiness/before c13af7b8a16fe4e58e9d404c849cdf323649b0ed
          dotnet ../readiness-after-bin/CoreSim.Tests.dll smoke results/readiness/after "$(git rev-parse HEAD)"
          python tools/minimal-yield-audit/compatibility.py readiness results/readiness
      - name: Reproduce original REA-001 and verify the corrected production heats
        shell: bash
        run: |
          git fetch origin 350f59cc53184399066bdf93b18341e4628ec8ef
          git worktree add --detach ../rea001-baseline 350f59cc53184399066bdf93b18341e4628ec8ef
          baseline="$(cd ../rea001-baseline && pwd)"
          dotnet build tools/race-engine-readiness -c Release --warnaserror -p:CoreSimRoot="$baseline" -o ../rea001-before-bin
          for configuration in A B C; do
            dotnet ../rea001-before-bin/CoreSim.Tests.dll repro "results/rea001/before-$configuration" 350f59cc53184399066bdf93b18341e4628ec8ef outside 7 "$configuration"
            dotnet ../readiness-after-bin/CoreSim.Tests.dll repro "results/rea001/after-$configuration" "$(git rev-parse HEAD)" outside 7 "$configuration"
          done
          python tools/rea001-safety-audit/compare.py results/rea001
      - name: Exact REA-009 physical traversal preservation and bounded original decimal regressions
        shell: bash
        run: |
          git fetch origin cd19c399dfc97d7abbd2aca03d50aa2c94a76262
          git worktree add --detach ../rea009-baseline cd19c399dfc97d7abbd2aca03d50aa2c94a76262
          baseline="$(cd ../rea009-baseline && pwd)"
          dotnet build tools/rea009-handoff-audit -c Release --warnaserror -p:CoreSimRoot="$baseline" -o ../rea009-physical-before-bin
          dotnet build tools/rea009-handoff-audit -c Release --warnaserror -o ../rea009-physical-after-bin
          dotnet ../rea009-physical-before-bin/CoreSim.Tests.dll capture results/rea009/physical-before.json
          dotnet ../rea009-physical-after-bin/CoreSim.Tests.dll capture results/rea009/physical-after.json
          python tools/rea009-handoff-audit/compare.py results/rea009/physical-before.json results/rea009/physical-after.json --report results/rea009/physical-comparison.json
          for scenario in three-squeeze four-close-regain; do
            for configuration in A B C; do
              dotnet ../readiness-after-bin/CoreSim.Tests.dll repro "results/rea009/after-$scenario-19-$configuration" "$(git rev-parse HEAD)" "$scenario" 19 "$configuration"
            done
          done
      - name: Retain Windows golden, shape, storm and contact-order assertions
        run: python tools/ci/check-windows-captures.py results
      - name: Repeat the exact Windows candidate capture in a fresh process
        shell: bash
        run: |
          dotnet run --project tools/trajectory-audit -c Release --no-build -- results/replay
          python tools/trajectory-audit/compare.py results capture replay
          python tools/rea001-safety-audit/compare.py results/rea001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-windows
          path: results
          if-no-files-found: error

  python:
    # Calibration comparators remain tested even in Draft mode.
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Keep frozen Git blob bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/calibration -p 'test_*.py'
      - run: python -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Test recorded replay data and viewer semantics (no npm)
        run: node --test tools/replay-viewer/replay.test.mjs

  required:
    # Draft work never emits a skipped/successful Full Windows CI check.
    # Manual/weekly runs cannot replace the PR's required check at the same SHA.
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual Windows CI' || github.event_name == 'schedule' && 'Scheduled Windows CI' || (github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base) && 'PR metadata' || (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:historical-audit')) && 'Full Windows CI' || 'Draft Windows CI' }}
    needs: [coverage, dotnet, python, historical-audits]
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected responsibility and the current PR state
        uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const jobs = JSON.parse(process.env.NEEDS);
            for (const name of ['coverage', 'dotnet', 'python']) {
              if (jobs[name].result !== 'success') {
                core.setFailed(`${name}: ${jobs[name].result}`);
              }
            }
            const audit = jobs.coverage.outputs.historical === 'true';
            if (jobs['historical-audits'].result !== (audit ? 'success' : 'skipped')) {
              core.setFailed(`historical-audits: ${jobs['historical-audits'].result}`);
            }
            if (context.payload.pull_request) {
              const {data: current} = await github.rest.pulls.get({
                ...context.repo, pull_number: context.payload.pull_request.number
              });
              const tested = context.payload.pull_request;
              const full = !current.draft || current.labels.some(l => l.name === 'ci:historical-audit');
              if (current.state !== 'open' || current.head.sha !== tested.head.sha ||
                  current.base.sha !== tested.base.sha ||
                  full !== (jobs.coverage.outputs.full === 'true')) {
                core.setFailed('PR head, base or Draft/Ready state changed; the new CI run must pass.');
              }
            }
